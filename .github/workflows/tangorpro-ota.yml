name: WildGraphene - upstream builds and OTA preparation

on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: Rebuild even if these upstream versions were already prepared
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: tangorpro-ota
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.discover.outputs.release }}
      build: ${{ steps.discover.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - name: Test upstream and patch handling
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Find the last successfully prepared upstream combination
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p previous upstream-state
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/tangorpro-ota.yml/runs?status=success&per_page=20" > "$RUNNER_TEMP/runs.json"
          python3 - <<'PY' > "$RUNNER_TEMP/run-ids.txt"
          import json, os
          runs=json.load(open(os.environ['RUNNER_TEMP']+'/runs.json'))['workflow_runs']
          for run in runs:
              if str(run['id']) != os.environ['GITHUB_RUN_ID'] and run['head_branch']=='main':
                  print(run['id'])
          PY
          while read -r id; do
            if gh run download "$id" --repo "$GITHUB_REPOSITORY" --name upstream-state --dir previous; then
              test -f previous/candidate.json
              break
            fi
          done < "$RUNNER_TEMP/run-ids.txt"
      - name: Resolve current GrapheneOS and KernelSU-Next/SUSFS commits
        id: discover
        env:
          FORCE_BUILD: ${{ inputs.force_build }}
        run: |
          set -euo pipefail
          args=(--output upstream-state/candidate.json)
          if [[ -f previous/candidate.json ]]; then args+=(--previous previous/candidate.json); fi
          if [[ "$FORCE_BUILD" == true ]]; then args+=(--force); fi
          python3 scripts/track-upstreams.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: upstream-state
          path: upstream-state/candidate.json
          retention-days: 90

  prepare:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: upstream-state
          path: upstream-state/
      - name: Free unused hosted-runner SDK space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h .
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 libssl-dev libelf-dev bc bison flex rsync zip unzip file lz4 zstd dwarves e2fsprogs kmod pkg-config cmake clang protobuf-compiler
      - name: Install pinned OTA tools
        run: bash scripts/install-ota-tools.sh
      - name: Prepare the current upstream source combination
        run: python3 scripts/refresh-kernel-snapshot.py --state upstream-state/candidate.json
      - name: Build kernel and matching modules
        env:
          WILDGRAPHENE_CANDIDATE_SOURCE: '1'
        run: |
          set -o pipefail
          mkdir -p artifacts
          bash scripts/build-graphene-tangorpro.sh 2>&1 | tee artifacts/build.log
      - name: Verify upstream and prepare matching partitions
        run: bash scripts/prepare-ota.sh
      - name: Preserve prepared OTA inputs for local signing
        uses: actions/upload-artifact@v4
        with:
          name: prepared-tangorpro-${{ needs.check.outputs.release }}
          path: prepared/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Preserve the candidate snapshot for conflict diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-snapshot-${{ needs.check.outputs.release }}
          path: |
            kernel/tangorpro/
            ota/tangorpro.json
          retention-days: 14
      - name: Preserve kernel logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-logs-${{ needs.check.outputs.release }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
      - name: Show local signing command
        run: |
          echo 'Build and OTA packaging passed. Signing keys were not used.' >> "$GITHUB_STEP_SUMMARY"
          echo "Run locally: bash scripts/sign-local-update.sh $GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
